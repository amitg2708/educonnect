{% extends "base.html" %}

{% block title %}Reset Link Sent - EduConnect{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card p-4 p-md-5 border-0 rounded-4 feature-card text-center shadow-lg">
                <div class="metric-icon-circle mx-auto mb-3" style="width: 64px; height: 64px;">
                    <i class="bi bi-envelope-check text-success fs-2"></i>
                </div>
                <h3 class="fw-bold mb-2">Check Your Inbox</h3>
                <p class="text-secondary small mb-4">
                    If an account exists with the email you entered, we have sent instructions for resetting your password.
                </p>
                <a href="{% url 'accounts:login' %}" class="btn btn-primary w-100 py-2 fw-semibold">
                    Return to Login
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
