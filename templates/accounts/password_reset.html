{% extends "base.html" %}

{% block title %}Reset Password - EduConnect{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card p-4 p-md-5 border-0 rounded-4 feature-card shadow-lg">
                <div class="text-center mb-4">
                    <div class="brand-icon-box mx-auto mb-3" style="width: 52px; height: 52px;">
                        <i class="bi bi-key-fill text-primary fs-3"></i>
                    </div>
                    <h3 class="fw-bold mb-1">Reset Password</h3>
                    <p class="text-secondary small">Enter your registered email address to receive password reset instructions.</p>
                </div>

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-4">
                        <label class="form-label text-secondary small fw-semibold">Email Address</label>
                        <input type="email" name="email" class="form-control" placeholder="name@example.com" required id="id_email">
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                        <i class="bi bi-send me-1"></i> Send Reset Link
                    </button>
                </form>

                <div class="text-center mt-4 pt-3 border-top border-secondary-subtle">
                    <a href="{% url 'accounts:login' %}" class="small text-secondary text-decoration-none">
                        &larr; Return to Sign In
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
