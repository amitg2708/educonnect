{% extends "base.html" %}

{% block title %}Password Reset Complete - EduConnect{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card p-4 p-md-5 border-0 rounded-4 feature-card text-center shadow-lg">
                <div class="metric-icon-circle mx-auto mb-3" style="width: 64px; height: 64px;">
                    <i class="bi bi-shield-check text-success fs-2"></i>
                </div>
                <h3 class="fw-bold mb-2">Password Reset Successful</h3>
                <p class="text-secondary small mb-4">
                    Your password has been changed successfully. You can now sign in with your new credentials.
                </p>
                <a href="{% url 'accounts:login' %}" class="btn btn-primary w-100 py-2 fw-semibold">
                    Sign In Now
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
