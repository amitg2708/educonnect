services:
  - type: web
    name: educonnect
    runtime: python
    plan: free
    region: oregon
    buildCommand: "./build.sh"
    startCommand: "gunicorn educonnect.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DJANGO_ENV
        value: production
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECURE_SSL
        value: "True"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_NAME
        value: educonnect_db
